
services:
  db:
    image: postgres:17-alpine
    container_name: daynix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daynix
      POSTGRES_USER: daynix_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - daynix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daynix_user -d daynix"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_ui:
    image: sosedoff/pgweb:0.16.2
    container_name: daynix-db-ui
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8081"
    command:
      - "--bind=0.0.0.0"
      - "--listen=8081"
      - "--url=postgresql://daynix_user:local_dev_password@db:5432/daynix?sslmode=disable"

volumes:
  daynix_postgres_data:
